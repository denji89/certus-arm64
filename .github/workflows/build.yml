name: Build Cactus Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libc6-dev libncurses-dev device-tree-compiler ccache lz4 lzop zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3 python2

    - name: Download Proton-Clang Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/toolchain

    - name: Patch Typos and Compile Kernel
      run: |
        export PATH="$HOME/toolchain/bin:$PATH"
        
        # 1. Automatically fix the developer's copy-paste typo
        sed -i 's/+static int can_umount/static int can_umount/g' fs/namespace.c
        
        # 2. Tell the compiler to stop treating minor warnings as fatal errors
        find . -name "Makefile" -exec sed -i 's/-Werror\b//g' {} +
        
        # 3. Start the build (strictly enforcing Clang and warning bypass)
        make O=out ARCH=arm64 cactus_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error"

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Cactus
        path: out/arch/arm64/boot/Image.gz-dtb
