name: Build Certus Pentest Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev make libc6-dev libncurses-dev device-tree-compiler ccache lz4 lzop zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3

    - name: Clone Unbroken Kernel Source
      run: |
        # Pulling the trusted MT6765 community tree
        git clone --depth=1 https://github.com/xiaomi-mt6765-devs/android_kernel_xiaomi_mt6765.git kernel
        
    - name: Clone Proton Clang Toolchain
      run: |
        # Bringing in the ultimate Android compiler
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Inject Monitor Mode & RT5370 Drivers
      run: |
        cd kernel
        
        # Inject the exact framework and Ralink drivers needed for Packet Injection
        cat <<EOF >> arch/arm64/configs/certus_defconfig
        CONFIG_WIRELESS=y
        CONFIG_CFG80211=y
        CONFIG_MAC80211=y
        CONFIG_WLAN_VENDOR_RALINK=y
        CONFIG_RT2X00=y
        CONFIG_RT2800USB=y
        CONFIG_RT2800USB_RT53XX=y
        CONFIG_RT2X00_LIB_USB=y
        CONFIG_RT2X00_LIB_FIRMWARE=y
        CONFIG_RT2X00_LIB_CRYPTO=y
        EOF
        
        # Strip strict warnings
        find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror-/-W/g' {} +
        find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror\b//g' {} +

    - name: Compile the Kernel
      run: |
        cd kernel
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export HOSTCFLAGS="-fcommon"
        
        # Setup configuration using Clang
        make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- certus_defconfig
        
        # Disable security module blocking
        sed -i 's/CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/g' out/.config
        sed -i 's/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/g' out/.config
        
        # THE FIX: Eradicate the ghost dtbo_check requirement from all device tree makefiles
        find arch/arm64/boot/dts -type f -name "Makefile" -exec sed -i 's/dtbo_check//g' {} +
        
        # Start the build using Clang
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz-dtb KCFLAGS="-Wno-error"

    - name: Upload Pentest Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Certus-Pentest-Kernel
        path: kernel/out/arch/arm64/boot/Image.gz-dtb
