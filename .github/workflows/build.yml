name: Build Certus Pentest Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev make libc6-dev libncurses-dev device-tree-compiler ccache lz4 lzop zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3

    - name: Clone Unbroken Kernel Source
      run: |
        # Pulling the trusted MT6765 community tree
        git clone --depth=1 https://github.com/xiaomi-mt6765-devs/android_kernel_xiaomi_mt6765.git kernel
        
    - name: Clone Proton Clang Toolchain
      run: |
        # Bringing in the ultimate Android compiler
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Inject Monitor Mode, RT5370 Drivers & Missing Configs
      run: |
        cd kernel
        
        # Inject the exact framework, Ralink drivers, and MISSING SCHEDULER VARS
        cat <<EOF >> arch/arm64/configs/certus_defconfig
        CONFIG_WIRELESS=y
        CONFIG_CFG80211=y
        CONFIG_MAC80211=y
        CONFIG_WLAN_VENDOR_RALINK=y
        CONFIG_RT2X00=y
        CONFIG_RT2800USB=y
        CONFIG_RT2800USB_RT53XX=y
        CONFIG_RT2X00_LIB_USB=y
        CONFIG_RT2X00_LIB_FIRMWARE=y
        CONFIG_RT2X00_LIB_CRYPTO=y
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_RT_GROUP_SCHED=y
        EOF
        
        # Strip strict warnings
        find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror-/-W/g' {} +
        find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror\b//g' {} +

    - name: Compile the Kernel
      run: |
        cd kernel
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export HOSTCFLAGS="-fcommon"
        
        # Setup configuration using Clang
        make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- certus_defconfig
        
        # Disable security module blocking
        sed -i 's/CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/g' out/.config
        sed -i 's/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/g' out/.config
        
        # THE TRUE FIX: Eradicate the ghost dtbo_check requirement
        find arch/arm64 -type f -name "Makefile" -exec sed -i 's/dtbo_check//g' {} +
        sed -i 's/dtbo_check//g' Makefile
        
        # RESTORED FIX 1: Patch the broken MediaTek Scheduler variable
        sed -i '1i #ifndef NOHZ_BALANCE_KICK\n#define NOHZ_BALANCE_KICK 0\nstatic unsigned long _dummy_nohz = 0;\n#define nohz_flags(cpu) (&_dummy_nohz)\n#endif' kernel/sched/core.c
        
        # RESTORED FIX 2: Delete the broken hang_detected timer call
        sed -i '/hang_detected/d' kernel/time/hrtimer.c
        
        # RESTORED FIX 3: Fix sloppy function order in the Energy Aware Scheduler
        sed -i '1i struct task_struct;\nint find_best_idle_cpu(struct task_struct *p, bool prefer_idle);' kernel/sched/eas_plus.c
        
        # FIX 4: The Ultimate Linker Bypass (Stub missing proprietary functions)
        cat <<EOF > lib/dummy_mtk.c
        void aee_save_excp_regs(void) {}
        int arch_scale_freq_capacity(void *a, int b) { return 0; }
        void aee_stop_nested_panic(void) {}
        int memory_ssmr_inited = 0;
        int is_zmc_inited(void) { return 0; }
        unsigned long zmc_max_zone_dma_phys = 0;
        void zmc_get_range(void) {}
        void _mt_irq_set_polarity(int irq, int pol) {}
        char *stpcpy(char *dest, const char *src) { while ((*dest++ = *src++)); return dest - 1; }
        int bcmp(const void *s1, const void *s2, unsigned long n) { const unsigned char *p1 = s1, *p2 = s2; while (n-- > 0) if (*p1++ != *p2++) return 1; return 0; }
        void nohz_balance_clear_nohz_mask(void) {}
        void remove_cpu_from_prefer_schedule_domain(void) {}
        void add_cpu_to_prefer_schedule_domain(void) {}
        int task_prefer_fit(void) { return 0; }
        int check_freq_turning(void) { return 0; }
        int stune_task_threshold = 0;
        int upower_get_turn_point(void) { return
