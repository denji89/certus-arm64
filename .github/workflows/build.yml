name: Build Cactus Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libc6-dev libncurses-dev device-tree-compiler ccache lz4 lzop zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Download Proton-Clang Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/toolchain

    - name: Compile Kernel
      run: |
        export PATH="$HOME/toolchain/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        make O=out cactus_defconfig
        make -j$(nproc --all) O=out

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Cactus
        path: out/arch/arm64/boot/Image.gz-dtb
