name: Build Cactus Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev make libc6-dev libncurses-dev device-tree-compiler ccache lz4 lzop zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3 python2

    - name: Patch Typos and Compile Kernel
      run: |
        # 1. Automatically fix the developer's copy-paste typo
        sed -i 's/+static int can_umount/static int can_umount/g' fs/namespace.c
        
        # 2. Fix Ubuntu 22.04 compatibility for older kernels
        export HOSTCFLAGS="-fcommon"
        
        # 3. Setup Config using system GCC
        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- cactus_defconfig
        
        # 4. FORCE DISABLE Stack Protector
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' out/.config
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config
        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig
        
        # 5. Start the actual build with GCC
        make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Cactus
        path: out/arch/arm64/boot/Image.gz-dtb
