name: Build Certus Pentest Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential bc bison flex libssl-dev make libc6-dev libncurses-dev device-tree-compiler ccache lz4 lzop zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3

    - name: Clone Unbroken Kernel Source
      run: |
        git clone --depth=1 https://github.com/xiaomi-mt6765-devs/android_kernel_xiaomi_mt6765.git kernel
        
    - name: Clone Proton Clang Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Patch Kernel Source Code
      run: |
        # 1. Fix the Networking 'stack_trace' error (Incomplete Type)
        sed -i '1i #include <linux/stacktrace.h>' kernel/net/core/rtnetlink.c

        # 2. Create Dummy Headers for MediaTek (Stops the 'file not found' errors)
        mkdir -p kernel/drivers/misc/mediatek/include/mt-plat/
        touch kernel/drivers/misc/mediatek/include/mt-plat/mt_om_api.h
        mkdir -p kernel/drivers/misc/mediatek/eccci/
        touch kernel/drivers/misc/mediatek/eccci/ccci_config.h
        touch kernel/drivers/misc/mediatek/eccci/cccs_config.h

        # 3. Patch Scheduler errors (Using Absolute Paths)
        sed -i 's/.*rt_rq->rq.*/\/\/ patched/g' kernel/kernel/sched/rt.c
        sed -i 's/.*rt.rt_rq.*/\/\/ patched/g' kernel/kernel/sched/rt.c
        sed -i '1i struct task_struct;\nint find_best_idle_cpu(struct task_struct *p, bool prefer_idle);' kernel/kernel/sched/eas_plus.c
        sed -i '/hang_detected/d' kernel/kernel/time/hrtimer.c

        # 4. Strip strict warnings globally
        find kernel -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror-/-W/g' {} +
        find kernel -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror\b//g' {} +

        # 5. The Ultimate Linker Bypass (Dummy File)
        mkdir -p kernel/lib
        echo "void aee_save_excp_regs(void) {}" > kernel/lib/dummy_mtk.c
        echo "int arch_scale_freq_capacity(void *a, int b) { return 0; }" >> kernel/lib/dummy_mtk.c
        echo "void aee_stop_nested_panic(void) {}" >> kernel/lib/dummy_mtk.c
        echo "int memory_ssmr_inited = 0;" >> kernel/lib/dummy_mtk.c
        echo "int is_zmc_inited(void) { return 0; }" >> kernel/lib/dummy_mtk.c
        echo "unsigned long zmc_max_zone_dma_phys = 0;" >> kernel/lib/dummy_mtk.c
        echo "void zmc_get_range(void) {}" >> kernel/lib/dummy_mtk.c
        echo "void _mt_irq_set_polarity(int irq, int pol) {}" >> kernel/lib/dummy_mtk.c
        echo "char *stpcpy(char *dest, const char *src) { while ((*dest++ = *src++)); return dest - 1; }" >> kernel/lib/dummy_mtk.c
        echo "int bcmp(const void *s1, const void *s2, unsigned long n) { const unsigned char *p1 = s1, *p2 = s2; while (n-- > 0) if (*p1++ != *p2++) return 1; return 0; }" >> kernel/lib/dummy_mtk.c
        echo "void nohz_balance_clear_nohz_mask(void) {}" >> kernel/lib/dummy_mtk.c
        echo "void remove_cpu_from_prefer_schedule_domain(void) {}" >> kernel/lib/dummy_mtk.c
        echo "void add_cpu_to_prefer_schedule_domain(void) {}" >> kernel/lib/dummy_mtk.c
        echo "int task_prefer_fit(void) { return 0; }" >> kernel/lib/dummy_mtk.c
        echo "int check_freq_turning(void) { return 0; }" >> kernel/lib/dummy_mtk.c
        echo "int stune_task_threshold = 0;" >> kernel/lib/dummy_mtk.c
        echo "int upower_get_turn_point(void) { return 0; }" >> kernel/lib/dummy_mtk.c
        echo "void update_sched_hint(void) {}" >> kernel/lib/dummy_mtk.c
        echo "int select_task_prefer_cpu(void) { return 0; }" >> kernel/lib/dummy_mtk.c
        echo "int mt_need_uart_console = 0;" >> kernel/lib/dummy_mtk.c
        echo "void mtk8250_uart_dump(void) {}" >> kernel/lib/dummy_mtk.c
        echo "void mtk_btag_pidlog_set_pid(void) {}" >> kernel/lib/dummy_mtk.c
        echo "int rtc_set_alarm_poweron(void) { return 0; }" >> kernel/lib/dummy_mtk.c
        echo "void mtk_btag_pidlog_submit_bio(void) {}" >> kernel/lib/dummy_mtk.c
        echo "void mtk_btag_pidlog_map_sg(void) {}" >> kernel/lib/dummy_mtk.c
        echo "obj-y += dummy_mtk.o" >> kernel/lib/Makefile

    - name: Configure the Kernel
      run: |
        cd kernel
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export HOSTCFLAGS="-fcommon"
        
        DEF_TARGET=$(cd arch/arm64/configs && find . -type f -name "*defconfig" | grep -iE "certus|cactus|mt6765" | head -n 1 | sed 's|^\./||')
        if [ -z "$DEF_TARGET" ]; then DEF_TARGET="defconfig"; fi
        
        make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- $DEF_TARGET
        
        # Inject Pentest Configs
        echo "CONFIG_WIRELESS=y" >> out/.config
        echo "CONFIG_CFG80211=y" >> out/.config
        echo "CONFIG_MAC80211=y" >> out/.config
        echo "CONFIG_WLAN_VENDOR_RALINK=y" >> out/.config
        echo "CONFIG_RT2X00=y" >> out/.config
        echo "CONFIG_RT2800USB=y" >> out/.config
        echo "CONFIG_RT2800USB_RT53XX=y" >> out/.config
        echo "CONFIG_RT2X00_LIB_USB=y" >> out/.config
        echo "CONFIG_RT2X00_LIB_FIRMWARE=y" >> out/.config
        echo "CONFIG_RT2X00_LIB_CRYPTO=y" >> out/.config
        
        # Disable broken modules
        sed -i 's/CONFIG_MTK_MEMINFO=y/# CONFIG_MTK_MEMINFO is not set/g' out/.config
        sed -i 's/CONFIG_MTK_CCCI_DEVS=y/# CONFIG_MTK_CCCI_DEVS is not set/g' out/.config
        sed -i 's/CONFIG_KVM=y/# CONFIG_KVM is not set/g' out/.config
        sed -i 's/CONFIG_RT_GROUP_SCHED=y/# CONFIG_RT_GROUP_SCHED is not set/g' out/.config
        
        make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

    - name: Compile the Kernel
      run: |
        cd kernel
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export HOSTCFLAGS="-fcommon"
        
        # Final cleanup of dtbo_check
        find arch/arm64 -type f -name "Makefile" -exec sed -i 's/dtbo_check//g' {} +
        sed -i 's/dtbo_check//g' Makefile
        
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz-dtb KCFLAGS="-Wno-error -fno-builtin"

    - name: Upload Pentest Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Certus-Pentest-Kernel
        path: kernel/out/arch/arm64/boot/Image.gz-dtb
        
